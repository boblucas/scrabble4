  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{padding:16px; max-width:1180px; margin:0 auto;}

  /* --- spel-switcher --- */
  .tabs{display:inline-flex; background:var(--btn); border:1px solid var(--btn-border);
    border-radius:10px; padding:3px; gap:3px; box-shadow:var(--shadow); margin-bottom:14px;}
  .tabs button{border:none; background:transparent; color:var(--btn-text);
    font:inherit; font-weight:700; font-size:.92rem; padding:7px 16px; border-radius:8px;
    cursor:pointer;}
  .tabs button.active{background:var(--tab-active); color:var(--tab-active-text);}
  .tabs button:not(.active):hover{background:var(--item-hover);}

  header h1{font-size:clamp(1.2rem,3.4vw,1.65rem); letter-spacing:.02em;}
  header .anchors{margin-top:6px; display:flex; flex-wrap:wrap; gap:6px 14px;
    font-size:.9rem; color:var(--muted);}
  header .anchors b{color:var(--text); font-family:ui-monospace,Menlo,Consolas,monospace;}
  header .split{margin-top:4px; font-size:.9rem; color:var(--muted);}
  header .split b{color:var(--text);}

  main{display:flex; gap:18px; margin-top:16px; align-items:flex-start;}
  .left{flex:0 1 auto; min-width:0;}
  .right{flex:1 1 300px; min-width:260px;}

  /* --- bord --- */
  .board-wrap{width:min(92vw,600px);}
  .board{display:grid; grid-template-columns:repeat(15,1fr);
    gap:2px; background:var(--board-bg); border:4px solid var(--board-bg);
    border-radius:8px; box-shadow:var(--shadow); user-select:none;}
  .sq{position:relative; aspect-ratio:1; background:var(--cell); border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    font-size:min(2.2vw,13px); font-weight:700; color:var(--muted); overflow:hidden;}
  .sq.tws{background:var(--tws); color:var(--prem-text-dark);}
  .sq.dws{background:var(--dws); color:#5c2020;}
  .sq.tls{background:var(--tls); color:var(--prem-text-dark);}
  .sq.dls{background:var(--dls); color:#1e3a5c;}
  .sq.center{background:var(--dws); color:#5c2020; font-size:min(3.4vw,20px);}
  .sq .prem{pointer-events:none;}

  .tile{position:absolute; inset:4%; background:var(--tile); border-radius:12%;
    border:1px solid var(--tile-edge);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;}
  .tile .tl{font-size:min(3.4vw,21px); font-weight:800; color:var(--tile-text);
    text-transform:uppercase; line-height:1;}
  .tile .tv{position:absolute; right:7%; bottom:3%;
    font-size:min(1.5vw,9px); font-weight:700; color:var(--tile-text); opacity:.85;}
  .tile.blank{background:var(--tile-blank); border-style:dashed;}
  .tile.blank::after{content:""; position:absolute; left:9%; top:9%;
    width:14%; height:14%; border-radius:50%; background:var(--accent);}
  .tile.last{outline:3px solid var(--hl); outline-offset:-1px;
    box-shadow:0 0 0 2px var(--hl), 0 0 10px 2px var(--hl),
      inset 0 -2px 0 rgba(0,0,0,.14); z-index:2;}
  .tile.lastsetup{outline:2px dashed var(--line); outline-offset:-1px;}

  /* --- navigatie --- */
  .nav{display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .nav button{background:var(--btn); color:var(--btn-text); border:1px solid var(--btn-border);
    border-radius:8px; font-size:1.15rem; line-height:1; padding:8px 14px; cursor:pointer;
    box-shadow:var(--shadow);}
  .nav button:hover{filter:brightness(1.06);}
  .nav button:active{transform:translateY(1px);}
  .nav .pos{font-variant-numeric:tabular-nums; font-weight:700; margin-left:4px;}
  .scorebar{margin-top:10px; display:flex; gap:16px; flex-wrap:wrap; align-items:baseline;}
  .scorebar .run{font-size:1.35rem; font-weight:800; font-variant-numeric:tabular-nums;}
  .scorebar .tot{color:var(--muted); font-size:.95rem;}
  .scorebar .tot b{color:var(--text);}
  .hint{margin-top:8px; font-size:.78rem; color:var(--muted);}

  /* --- zettenlijst --- */
  .right h2{font-size:1rem; margin-bottom:8px; display:flex; justify-content:space-between;
    align-items:baseline;}
  .right h2 .themebtn{font-size:.75rem; font-weight:400; background:var(--btn);
    color:var(--btn-text); border:1px solid var(--btn-border); border-radius:6px;
    padding:3px 8px; cursor:pointer;}
  .moves{list-style:none; max-height:min(600px,72vh); overflow-y:auto;
    background:var(--panel); border:1px solid var(--item-border); border-radius:10px;
    box-shadow:var(--shadow);}
  .moves li{display:flex; align-items:center; gap:8px; padding:7px 10px;
    border-bottom:1px solid var(--item-border); cursor:pointer; font-size:.9rem;}
  .moves li:last-child{border-bottom:none;}
  .moves li:hover{background:var(--item-hover);}
  .moves li.active{background:var(--item-active); box-shadow:inset 3px 0 0 var(--hl);}
  .moves .num{width:2.1em; text-align:right; color:var(--muted);
    font-variant-numeric:tabular-nums; flex:none;}
  .moves .words{flex:1 1 auto; min-width:0; overflow-wrap:anywhere;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem;}
  .moves li.setup .words{font-family:inherit; font-style:italic; color:var(--muted);}
  .moves .sc{flex:none; font-weight:800; font-variant-numeric:tabular-nums;}
  .badge{flex:none; font-size:.62rem; font-weight:800; letter-spacing:.05em;
    padding:2px 6px; border-radius:99px; color:#fff; text-transform:uppercase;}
  .badge.bingo{background:var(--badge-bingo);}
  .badge.slot{background:var(--badge-slot);}
  .badge.setup{background:var(--badge-setup);}

  @media (max-width:820px){
    main{flex-direction:column;}
    .right{width:100%;}
    .moves{max-height:44vh;}
  }
</style>

/* dutch2026 letterwaardes */
const VALNL = {a:1,b:3,c:5,d:2,e:1,f:4,g:3,h:4,i:1,j:4,k:3,l:3,m:3,n:1,o:1,
             p:3,q:10,r:2,s:2,t:2,u:4,v:4,w:5,x:8,y:8,z:4};
const N = 15;

const boardEl = document.getElementById("board");
const listEl  = document.getElementById("movelist");
const tabsEl  = document.getElementById("tabs");

/* per spel onthouden waar de gebruiker was */
const remembered = GAMES.map(() => null);

let gi = 0, G, MT, M, k = 0, cum = [], tiles = [], itemEls = [];

/* --- switcher-tabs --- */
const tabEls = META.map((m, i) => {
  const b = document.createElement("button");
  b.textContent = m.tab;
  b.addEventListener("click", () => loadGame(i));
  tabsEl.appendChild(b);
  return b;
});

function loadGame(i) {
  if (G) remembered[gi] = k;
  gi = i; G = GAMES[i]; MT = META[i]; M = G.moves.length;
  tabEls.forEach((b, j) => b.classList.toggle("active", j === i));
  try { history.replaceState(null, "", "#" + MT.hash); } catch (e) {}

  /* header */
  document.getElementById("h1").textContent = MT.h1;
  document.getElementById("anchors").innerHTML = MT.anchors(G);
  document.getElementById("split").innerHTML = MT.split(G);

  /* afgeleiden */
  const blankSet = new Set(G.blanks.map(([x,y]) => x + "," + y));
  const placedBy = new Map();
  G.moves.forEach((mv, mi) => mv.cells.forEach(([x,y]) => placedBy.set(x+","+y, mi)));
  cum = [0];
  G.moves.forEach((mv, mi) => cum.push(cum[mi] + mv.score));

  /* bord */
  boardEl.innerHTML = "";
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const sq = document.createElement("div");
    const lm = G.lm[y][x], wm = G.wm[y][x];
    let cls = "sq", label = "";
    if (x === 7 && y === 7)      { cls += " center"; label = "★"; }
    else if (wm === 3)           { cls += " tws";    label = "3W"; }
    else if (wm === 2)           { cls += " dws";    label = "2W"; }
    else if (lm === 3)           { cls += " tls";    label = "3L"; }
    else if (lm === 2)           { cls += " dls";    label = "2L"; }
    sq.className = cls;
    if (label) sq.innerHTML = `<span class="prem">${label}</span>`;
    const key = x + "," + y;
    if (placedBy.has(key)) {
      const letter = G.letters[y][x];
      const blank = blankSet.has(key);
      const tile = document.createElement("div");
      tile.className = "tile" + (blank ? " blank" : "");
      tile.innerHTML = `<span class="tl">${letter}</span>` +
        (blank ? "" : `<span class="tv">${(G.val||VALNL)[letter] ?? ""}</span>`);
      tile.dataset.move = placedBy.get(key);
      tile.style.display = "none";
      sq.appendChild(tile);
    }
    boardEl.appendChild(sq);
  }
  tiles = Array.from(boardEl.querySelectorAll(".tile"));

  /* zettenlijst */
  listEl.innerHTML = "";
  itemEls = G.moves.map((mv, mi) => {
    const li = document.createElement("li");
    if (mv.setup) li.className = "setup";
    li.innerHTML =
      `<span class="num">${mi+1}.</span>` +
      `<span class="words">${mv.words.join(" + ")}</span>` +
      (mv.setup ? `<span class="badge setup">opzet</span>` : "") +
      (mv.bingo ? `<span class="badge bingo">bingo</span>` : "") +
      (!mv.setup && mv.slot ? `<span class="badge slot">${MT.slotLabel}</span>` : "") +
      `<span class="sc">${mv.setup ? "—" : mv.score}</span>`;
    li.addEventListener("click", () => setState(mi + 1));
    listEl.appendChild(li);
    return li;
  });

  setState(remembered[i] ?? M);
}

/* --- spelstand --- */
function setState(nk) {
  k = Math.max(0, Math.min(M, nk));
  const lastSetup = k > 0 && !!G.moves[k - 1].setup;
  for (const t of tiles) {
    const mi = +t.dataset.move;
    t.style.display = (mi < k) ? "" : "none";
    const isLast = mi === k - 1;
    t.classList.toggle("last", isLast && !lastSetup);
    t.classList.toggle("lastsetup", isLast && lastSetup);
  }
  itemEls.forEach((li, i) => li.classList.toggle("active", i === k - 1));
  if (k > 0) itemEls[k - 1].scrollIntoView({block:"nearest"});
  document.getElementById("pos").textContent = `zet ${k}/${M}`;
  document.getElementById("runscore").textContent = `${cum[k]} punten`;
  document.getElementById("totscore").innerHTML =
    `eindtotaal <b>${G.total}</b>` + (k < M ? ` · nog ${G.total - cum[k]} te gaan` : ` · klaar!`);
}

/* --- navigatie --- */
document.getElementById("btnFirst").addEventListener("click", () => setState(0));
document.getElementById("btnPrev") .addEventListener("click", () => setState(k - 1));
document.getElementById("btnNext") .addEventListener("click", () => setState(k + 1));
document.getElementById("btnLast") .addEventListener("click", () => setState(M));
window.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && e.key === " ") return;
  switch (e.key) {
    case "ArrowRight": case " ": e.preventDefault(); setState(k + 1); break;
    case "ArrowLeft":  e.preventDefault(); setState(k - 1); break;
    case "Home":       e.preventDefault(); setState(0); break;
    case "End":        e.preventDefault(); setState(M); break;
  }
});

/* --- thematoggle --- */
document.getElementById("themebtn").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme
    ? r.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});

/* start: spel uit URL-hash, anders maxgame */
{
  const h = (typeof location !== "undefined" && location.hash || "").replace("#", "");
  const start = META.findIndex(m => m.hash === h);
  loadGame(start >= 0 ? start : 0);
}
